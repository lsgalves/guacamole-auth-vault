# Connection to the guacamole proxy daemon.
guacd-hostname: guacd
guacd-port: 4822

# ---------------------------------------------------------------------------
# Vault extension configuration
# ---------------------------------------------------------------------------
vault-addr: http://vault:8200

# The extension logs in with AppRole and uses short-lived tokens. The role ID
# and secret ID are provisioned at runtime by the vault-bootstrap service and
# shared through a Docker volume.
vault-approle-role-id-file: /vault-shared/guac.role-id
vault-approle-secret-id-file: /vault-shared/guac.secret-id

# SSH connections -> one-time password from the SSH secrets engine.
vault-ssh-mount: ssh
vault-ssh-role: otp_key_role

# RDP connections -> static password from the KV secrets engine, read at
# <kv-mount>/<kv-prefix>/<protocol>/<connection-name>. These are the defaults
# (shown explicitly); the dev-mode Vault mounts a KV v2 engine at secret/.
vault-kv-mount: secret
vault-kv-version: 2
vault-kv-prefix: guacamole
vault-kv-password-field: password

# Name of the parameter token that triggers the extension and is populated with
# the secret. Reference it from a connection's "password" parameter as
# ${VAULT_SECRET}.
vault-secret-token-name: VAULT_SECRET
