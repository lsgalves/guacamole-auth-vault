name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar
        run: mvn -B -q clean package

      - name: Create GitHub Release with the jar
        uses: softprops/action-gh-release@v3
        with:
          files: target/guacamole-auth-vault-ssh-otp-*.jar
          generate_release_notes: true
